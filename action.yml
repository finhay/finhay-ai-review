name: 'Finhay AI Review'
description: 'AI-powered PR review using any OpenAI-compatible API'
author: 'Finhay Tech'

inputs:
  model:
    description: 'LLM model name. Recommended: use org variable AI_REVIEW_MODEL'
    default: 'MiniMax-M2.7'
  api_base:
    description: 'OpenAI-compatible API base URL. Recommended: use org variable AI_REVIEW_API_BASE'
    default: 'https://api.minimaxi.chat/v1'
  api_key:
    description: 'API key for the LLM provider. Recommended: use org secret AI_REVIEW_API_KEY'
    required: true
  trigger_word:
    description: 'Trigger word for interactive mode'
    default: '@finhay-review'
  auto_review:
    description: 'Enable auto review on PR open/push'
    default: 'true'
  max_diff_lines:
    description: 'Max diff lines to review (skip if larger)'
    default: '10000'
  language:
    description: 'Review language (vi or en)'
    default: 'vi'
  review_level:
    description: 'Review strictness: relaxed, standard, strict'
    default: 'standard'
  include_nitpicks:
    description: 'Include nitpick-level comments'
    default: 'false'
  conventions_file:
    description: 'Path to conventions file'
    default: '.github/review-conventions.md'
  review_budget_minutes:
    description: 'Total LLM budget including verification and response bodies. Post partial coverage at expiry; keep below job timeout-minutes'
    default: '10'
  verify_findings:
    description: 'Verify candidate findings against bounded source context before posting (adds model requests)'
    default: 'true'
  auto_fix_metadata:
    description: 'Opt in to updating the PR title and description after a complete initial review'
    default: 'false'
  github_token:
    description: 'GitHub token for API access. Use a GitHub App token for custom bot name/avatar, or leave default for github-actions[bot]'
    default: ${{ github.token }}

runs:
  using: 'node24'
  main: 'src/index.mjs'
